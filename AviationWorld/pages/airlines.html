<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airlines — Skyline Aviation</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="airlines" data-base="../">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-head">
      <div class="container">
        <p class="eyebrow">Global carriers</p>
        <h1>Airlines</h1>
        <p class="lead">Filter by alliance and region, then open a carrier to see its fleet highlights.</p>
      </div>
    </section>
    <section class="container section">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search airline, country, hub or code…" aria-label="Search airlines">
        <select id="region" aria-label="Region"></select>
        <select id="sort" aria-label="Sort">
          <option value="name">Sort: Name</option>
          <option value="founded">Sort: Oldest first</option>
          <option value="country">Sort: Country</option>
        </select>
      </div>
      <div class="chips" id="alliances" role="group" aria-label="Alliance filter"></div>
      <p class="muted" id="count" aria-live="polite"></p>
      <div class="grid" id="list"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
